# /etc/nginx/sites-available/fish-dash.conf
#
# nginx terminates TLS for fish-dash.com using the Cloudflare Origin
# Certificate, and reverse-proxies to the uvicorn api container bound to
# 127.0.0.1:8000. Placing TLS at nginx (a host process) means UFW's INPUT
# filter actually sees the traffic — Docker's iptables NAT bypass that we hit
# when docker-proxy owned port 443 is no longer in the picture.
#
# Deploy notes:
#   - Origin cert and key live at /etc/nginx/certs/origin.crt and origin.key
#     (chmod 600 on the key, owned by root).
#   - Symlink this file into /etc/nginx/sites-enabled/ and remove the default
#     symlink before reload.
#   - Run `nginx -t` before reload; reload with `systemctl reload nginx`.

# HTTP -> HTTPS redirect. Anything hitting port 80 directly gets bounced to
# HTTPS. Cloudflare's "Always Use HTTPS" should already prevent this from
# being hit in practice, but it's belt-and-braces for any direct origin probes.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# Default server on 443: reject the TLS handshake outright when the SNI does
# not match a real server_name below. This means Censys/Shodan IP scans get
# no certificate in response — they can't even fingerprint that this is the
# fish-dash.com origin. Requires nginx >= 1.19.4 (Ubuntu 24.04 ships 1.24+).
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

# Real site
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fish-dash.com www.fish-dash.com;

    # Cloudflare Origin Certificate (issued by CF's internal CA, valid for
    # 15 years, not browser-trusted but Cloudflare's edge trusts it under
    # "Full (strict)" mode).
    ssl_certificate     /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    # Modern TLS only. CF -> origin always speaks TLS 1.2+ so this is safe.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS is added here because nginx is the actual TLS terminator now.
    # uvicorn's old _HAS_SSL-guarded HSTS no longer fires in production
    # because SSL_CERTFILE is unset on the container.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Generous body limit for any future uploads (video catalogue, etc.).
    # Default 1m is restrictive; bump to 50m to be safe without inviting abuse.
    client_max_body_size 50m;

    # Buffering tuned for a mix of small REST responses and the index.html
    # token-injected payload. Defaults are fine for the streaming /ws path
    # because the upgraded connection bypasses proxy_buffering anyway.
    proxy_buffers       8 16k;
    proxy_buffer_size   16k;

    # WebSocket endpoint. Must come before the catch-all `/` location.
    # Long timeouts so idle WS sessions stay open for the duration of a
    # browser tab. The dashboard's own ping loop (60s) keeps it warm.
    location /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        # Disable buffering on the WS path — irrelevant after upgrade but
        # avoids any chance of nginx holding onto frames.
        proxy_buffering off;
    }

    # Everything else: REST, static SPA, /api/health, /api/token/refresh.
    # X-Forwarded-For is built by $proxy_add_x_forwarded_for which prepends
    # the incoming CF-set value and appends nginx's view of the remote
    # address. uvicorn's `proxy_headers=True, forwarded_allow_ips="*"`
    # then takes the leftmost entry as the real client IP for the per-IP
    # rate limiter.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
