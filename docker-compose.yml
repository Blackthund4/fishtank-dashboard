services:
  ingestion:
    build:
      context: .
      dockerfile: Dockerfile.ingest
    volumes:
      - fishtank-data:/app/data
    environment:
      - FISHTANK_DB_PATH=/app/data/fishtank.db
      - FISHTANK_TOKEN_CACHE=/app/data/token_cache.json
      - FISHTANK_SHARED_STATE=/app/data/_shared_state.json
      - FISHTANK_EMAIL=${FISHTANK_EMAIL}
      - FISHTANK_PASSWORD=${FISHTANK_PASSWORD}
      # Suppress __pycache__ writes — simplifies container hardening and
      # avoids write attempts that would fail on a read-only rootfs.
      - PYTHONDONTWRITEBYTECODE=1
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.0
    # Defense-in-depth — no capabilities beyond what the entrypoint needs to
    # chown the volume and drop to the dashboard user via gosu.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN          # entrypoint: chown -R dashboard:dashboard /app/data
      - DAC_OVERRIDE   # entrypoint: write to volume regardless of DAC
      - FOWNER         # chown of files owned by other UIDs
      - SETUID         # gosu: drop privileges
      - SETGID         # gosu: drop privileges
    healthcheck:
      test: ["CMD", "sh", "-c", "[ -f /app/data/_shared_state.json ] && [ $(( $(date +%s) - $(stat -c %Y /app/data/_shared_state.json) )) -lt 120 ]"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  api:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    ports:
      - "443:8000"
    volumes:
      - fishtank-data:/app/data
      - /opt/fishtank-dashboard/certs:/app/certs:ro
    environment:
      - FISHTANK_DB_PATH=/app/data/fishtank.db
      - FISHTANK_SHARED_STATE=/app/data/_shared_state.json
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://fish-dash.com,https://www.fish-dash.com}
      - SSL_CERTFILE=/app/certs/origin.crt
      - SSL_KEYFILE=/app/certs/origin.key
      - API_TOKEN_SECRET=${API_TOKEN_SECRET:-}
      - PYTHONDONTWRITEBYTECODE=1
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 1.5
    # Read-only rootfs plus a small tmpfs for any /tmp scratch. /app/data is a
    # named volume and remains writable (SQLite WAL needs write access to the
    # -wal/-shm sidecar files, even for readers). Certs are mounted :ro.
    read_only: true
    tmpfs:
      - /tmp:size=64M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN          # entrypoint: chown -R dashboard:dashboard /app/data
      - DAC_OVERRIDE   # entrypoint: write to volume regardless of DAC
      - FOWNER         # chown of files owned by other UIDs
      - SETUID         # gosu: drop privileges
      - SETGID         # gosu: drop privileges
    healthcheck:
      test: ["CMD", "curl", "-sf", "--insecure", "https://localhost:8000/api/health"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  fishtank-data:
